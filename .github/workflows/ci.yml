name: CI

# Pull requests, plus pushes to main. Not every push to every branch: that ran each PR commit
# twice (push + pull_request) and used up free Actions minutes.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the run still in progress for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with a download cache keyed on uv.lock)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (from uv.lock)
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Same command (and output path) as documented in serving/Dockerfile, so the generated
      # header comment matches too; any difference means requirements.txt is stale.
      - name: Serving requirements match uv.lock
        run: |
          cp serving/requirements.txt /tmp/committed.txt
          uv export --frozen --no-dev --extra serve --no-emit-project --no-hashes \
            -o serving/requirements.txt
          diff -u /tmp/committed.txt serving/requirements.txt

      # Real-data and real-model tests skip here (no RSNA data or model in CI); the synthetic
      # preprocessing regression test runs.
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: docker build + container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The real model is not in git: build with a tiny stand-in that has the same interface.
      - name: Create stand-in model, thresholds and a synthetic DICOM
        run: |
          pip install numpy onnx pydicom
          python scripts/ci_smoke_assets.py

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: serving/Dockerfile
          tags: brainct-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and wait for /ready
        run: |
          docker run -d --name brainct -p 8000:8000 brainct-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 2
          done
          docker logs brainct
          exit 1

      - name: Smoke test /health, /predict, errors and /metrics
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -F "file=@smoke.dcm" http://127.0.0.1:8000/predict -o predict.json
          jq -e '.probabilities | length == 6' predict.json
          jq -e '.disclaimer | test("Research use only")' predict.json
          status=$(curl -s -o /dev/null -w "%{http_code}" -F "file=@README.md" \
            http://127.0.0.1:8000/predict)
          test "$status" = "422"
          curl -fsS http://127.0.0.1:8000/metrics | grep -q 'brainct_requests_total'

      - name: Container logs
        if: always()
        run: docker logs brainct || true
