[project]
name = "brainct"
version = "0.1.0"
description = "Brain CT hemorrhage detection: data pipeline, training and an optimized inference service. Research use only - not for clinical decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.1",
    "pyarrow>=15",
    "pydicom>=3.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "torch>=2.4",
    "torchvision>=0.19",
    "wandb>=0.17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# Laptop and CI use CPU builds of PyTorch (small, no GPU). The cluster keeps its own CUDA 12.6
# build, installed once by hand; `uv pip install -e` there leaves it in place.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainct"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Legacy research notebooks are kept for reference only and are not linted.
extend-exclude = ["classification", "segmentation", "3d segmentation"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
