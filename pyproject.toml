[project]
name = "brainct"
version = "0.1.0"
description = "Brain CT hemorrhage detection: data pipeline, training and an optimized inference service. Research use only - not for clinical decisions."
readme = "README.md"
requires-python = ">=3.11"
# Base = what preprocessing + ONNX inference need. The API image installs base + [serve] only,
# so it carries no PyTorch. Training, data jobs and export/quantization need [train].
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pillow>=10.1",
    "pydicom>=3.0",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]
train = [
    "onnx>=1.16",
    "onnxscript>=0.1",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "torch>=2.4",
    "torchvision>=0.19",
    "wandb>=0.17",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

# Laptop and CI use CPU builds of PyTorch (small, no GPU). The cluster keeps its own CUDA 12.6
# build, installed once by hand; `uv pip install -e ".[train]"` there leaves it in place.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainct"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Legacy research notebooks are kept for reference only and are not linted.
extend-exclude = ["classification", "segmentation", "3d segmentation"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Test helper modules imported by tests and scripts (tests/ and tests/regression/ on sys.path).
known-first-party = ["brainct", "dicom_factory", "synthetic_cases"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["brainct"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
